# Binder(mybinder.org) 실행 환경: 실행 시 자동으로 설치됩니다.
# Binder에는 GPU가 없으므로 CPU 전용 PyTorch를 설치합니다.
name: hydro-practices
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - pyyaml
  - ruamel.yaml
  - xarray
  - netcdf4
  - h5py
  - numba
  - tqdm
  - tensorboard
  - jupyter-server-proxy  # MyBinder에서 TensorBoard(포트 6006)를 /proxy/6006/ 경로로 열기 위해 필요
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch
    - lightning
    - git+https://github.com/realtime-dam-operation-using-AI/neuralhydrology.git
